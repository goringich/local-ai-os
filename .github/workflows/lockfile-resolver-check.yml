name: lockfile-resolver-check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Lockfile resolver verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Verify resolver-stable lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code -- package-lock.json package.json

      - name: Verify frozen install
        run: npm ci --ignore-scripts

      - name: Verify high-severity audit gate
        run: npm audit --audit-level=high
