name: Customer Package Lifecycle Lock Repair

on:
  push:
    branches:
      - feat/customer-package-current-20260906

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/customer-package-current-20260906

      - name: Verify repair ancestry
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor 3faf9de472aa3dbba73098c436c6e51c4a5458a3 HEAD
          test "$(git diff --name-only 3faf9de472aa3dbba73098c436c6e51c4a5458a3 HEAD)" = ".github/workflows/customer-package-lifecycle-lock-repair.yml"

      - name: Apply lifecycle safety repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("scripts/customer-package-secure.py")
          text = path.read_text(encoding="utf-8")

          old_imports = '''import argparse
          import importlib.util
          import json
          import os
          from pathlib import Path
          import shutil
          import tempfile
          from typing import Any, Mapping
          '''
          new_imports = '''import argparse
          from contextlib import contextmanager
          from functools import wraps
          import importlib.util
          import json
          import os
          from pathlib import Path
          import shutil
          import tempfile
          from typing import Any, Mapping
          '''
          if old_imports not in text:
            raise SystemExit("secure import block drifted")
          text = text.replace(old_imports, new_imports, 1)

          anchor = '''ANCHOR_SCHEMA = "2026-08-30.local-ai-os-trust-anchors.v1"


          def _real_file'''
          lock_code = '''ANCHOR_SCHEMA = "2026-08-30.local-ai-os-trust-anchors.v1"


          @contextmanager
          def _lifecycle_lock(root: Path):
            try:
              import fcntl
            except ImportError as exc:
              raise base.PackageError("secure lifecycle mutation requires POSIX flock support") from exc

            try:
              parent = root.parent.resolve(strict=True)
            except (OSError, RuntimeError) as exc:
              raise base.PackageError(
                "managed root parent must already exist for secure lifecycle locking"
              ) from exc
            if not parent.is_dir():
              raise base.PackageError("managed root parent must be a real directory")

            flags = os.O_RDONLY | getattr(os, "O_DIRECTORY", 0)
            try:
              fd = os.open(parent, flags)
            except OSError as exc:
              raise base.PackageError("cannot open managed root parent for lifecycle locking") from exc

            locked = False
            try:
              try:
                fcntl.flock(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)
              except BlockingIOError as exc:
                raise base.PackageError(
                  "another customer package lifecycle operation is already in progress"
                ) from exc
              except OSError as exc:
                raise base.PackageError("cannot acquire customer package lifecycle lock") from exc
              locked = True
              yield
            finally:
              if locked:
                fcntl.flock(fd, fcntl.LOCK_UN)
              os.close(fd)


          def _serialize_lifecycle_mutation(function):
            @wraps(function)
            def guarded(root: Path, *args, **kwargs):
              with _lifecycle_lock(root):
                return function(root, *args, **kwargs)

            return guarded


          def _real_file'''
          if anchor not in text:
            raise SystemExit("secure constant/function anchor drifted")
          text = text.replace(anchor, lock_code, 1)

          for signature in (
            "def install(\n",
            "def rollback(root: Path, version: str) -> dict[str, Any]:\n",
            "def uninstall(root: Path) -> dict[str, Any]:\n",
          ):
            if signature not in text:
              raise SystemExit(f"secure mutation signature drifted: {signature.strip()}")
            text = text.replace(signature, "@_serialize_lifecycle_mutation\n" + signature, 1)

          existing_anchor = '    existing_release = root / "releases" / "0.0.2-secure-test"\n'
          concurrency_test = '''    with _lifecycle_lock(root):
              concurrent_install_rejected = base.expect_blocked(lambda: install(
                root,
                third[0],
                third[1],
                third[2],
                release_public_key,
                third[3],
                entitlement_public_key,
              ))
              concurrent_rollback_rejected = base.expect_blocked(
                lambda: rollback(root, "0.0.1-secure-test")
              )
              concurrent_uninstall_rejected = base.expect_blocked(lambda: uninstall(root))
            if base.current_state(root).get("version") != "0.0.2-secure-test":
              raise base.PackageError("rejected concurrent lifecycle mutation changed current release")
            if (root / "releases" / "0.0.3-secure-test").exists():
              raise base.PackageError("rejected concurrent install created release payload")
            doctor(root)

          '''
          if text.count(existing_anchor) != 1:
            raise SystemExit("secure concurrency selftest anchor drifted")
          text = text.replace(existing_anchor, concurrency_test + existing_anchor, 1)

          uninstall_marker = '''@_serialize_lifecycle_mutation
          def uninstall(root: Path) -> dict[str, Any]:
          '''
          uninstall_guard = '''def _verify_uninstall_scope(root: Path) -> None:
            expected_root = {base.MARKER, base.CURRENT, "releases", ANCHOR_DIR}
            actual_root = {entry.name for entry in root.iterdir()}
            unexpected_root = sorted(actual_root - expected_root)
            missing_root = sorted(expected_root - actual_root)
            if unexpected_root or missing_root:
              raise base.PackageError("managed root inventory is not exact enough for secure uninstall")

            releases = base.managed_releases_root(root, create=False)
            for release_root in releases.iterdir():
              if release_root.is_symlink() or not release_root.is_dir():
                raise base.PackageError("managed release inventory contains an unsafe entry")
              version = base.safe_version(release_root.name)
              verified = verify_installed_trust(root, version)

              expected_release = {"artifacts", "release-manifest.json", "entitlement.json", TRUST_DIR}
              actual_release = {entry.name for entry in release_root.iterdir()}
              if actual_release != expected_release:
                raise base.PackageError("installed release contains unexpected or missing managed content")

              trust = release_root / TRUST_DIR
              expected_trust = {
                TRUST_RECEIPT,
                "release.sig",
                "release-public-key.pem",
                "entitlement.sig",
                "entitlement-public-key.pem",
              }
              actual_trust = {entry.name for entry in trust.iterdir()}
              if actual_trust != expected_trust:
                raise base.PackageError("installed trust directory inventory is not exact")

              artifact_root = release_root / "artifacts"
              expected_files = {
                str(base.safe_relative(row.get("path")))
                for row in verified["release"]["artifacts"]
              }
              allowed_dirs = set()
              for relative in expected_files:
                parent = Path(relative).parent
                while str(parent) not in {"", "."}:
                  allowed_dirs.add(str(parent))
                  parent = parent.parent

              actual_files = set()
              for candidate in artifact_root.rglob("*"):
                relative = str(candidate.relative_to(artifact_root))
                if candidate.is_symlink():
                  raise base.PackageError("installed artifact inventory contains a symlink")
                if candidate.is_file():
                  actual_files.add(relative)
                elif candidate.is_dir():
                  if relative not in allowed_dirs:
                    raise base.PackageError("installed artifact inventory contains an unexpected directory")
                else:
                  raise base.PackageError("installed artifact inventory contains an unsafe entry")
              if actual_files != expected_files:
                raise base.PackageError("installed artifact inventory is not exact")


          @_serialize_lifecycle_mutation
          def uninstall(root: Path) -> dict[str, Any]:
          '''
          if uninstall_marker not in text:
            raise SystemExit("secure uninstall anchor drifted")
          text = text.replace(uninstall_marker, uninstall_guard, 1)

          old_uninstall = '''  verified = doctor(root)
            result = base.uninstall(root)
          '''
          new_uninstall = '''  verified = doctor(root)
            _verify_uninstall_scope(root)
            result = base.uninstall(root)
          '''
          if old_uninstall not in text:
            raise SystemExit("secure uninstall body drifted")
          text = text.replace(old_uninstall, new_uninstall, 1)

          anchor_tamper = '    anchor_release_key = root / ANCHOR_DIR / "release-public-key.pem"\n'
          unexpected_test = '''    unexpected_file = root / "do-not-delete.txt"
            unexpected_file.write_text("must survive rejected uninstall\\n", encoding="utf-8")
            unexpected_content_uninstall_rejected = base.expect_blocked(lambda: uninstall(root))
            if not unexpected_file.is_file():
              raise base.PackageError("secure uninstall deleted unexpected managed-root content")
            unexpected_file.unlink()
            doctor(root)

          '''
          if text.count(anchor_tamper) != 1:
            raise SystemExit("secure uninstall selftest anchor drifted")
          text = text.replace(anchor_tamper, unexpected_test + anchor_tamper, 1)

          result_line = '      "transactional_install_failure_recovered": transactional_install_failure_recovered,\n'
          result_extra = result_line + '''      "concurrent_install_rejected": concurrent_install_rejected,
              "concurrent_rollback_rejected": concurrent_rollback_rejected,
              "concurrent_uninstall_rejected": concurrent_uninstall_rejected,
              "unexpected_content_uninstall_rejected": unexpected_content_uninstall_rejected,
          '''
          if text.count(result_line) != 1:
            raise SystemExit("secure selftest result anchor drifted")
          text = text.replace(result_line, result_extra, 1)
          path.write_text(text, encoding="utf-8")

          readme = Path("customer-package/README.md")
          readme_text = readme.read_text(encoding="utf-8")
          recovery = "- transactional secure install recovery: if trust persistence or post-install verification fails, the previous `current.json` is restored, failed release material is removed, and a failed first bootstrap restores the target to its pre-install state;\n"
          addition = recovery + "- fail-closed lifecycle serialization: install, rollback and uninstall take a non-blocking exclusive lock on the existing parent directory of the managed root, so overlapping secure mutations are rejected before package state can be changed;\n- secure lifecycle mutation requires the managed-root parent directory to already exist; the secure entrypoint does not create missing parent-directory chains;\n"
          if recovery not in readme_text:
            raise SystemExit("customer package README recovery anchor drifted")
          readme_text = readme_text.replace(recovery, addition, 1)
          uninstall_old = "- secure uninstall only after the current package passes the full signed `doctor` path; a marker alone cannot authorize recursive deletion, and a tampered package is not silently removed."
          uninstall_new = "- secure uninstall only after the current package passes the full signed `doctor` path and every installed release plus the managed-root inventory verifies exactly; unexpected files/directories block recursive deletion, so unrelated content is never silently removed."
          if uninstall_old not in readme_text:
            raise SystemExit("customer package README uninstall anchor drifted")
          readme_text = readme_text.replace(uninstall_old, uninstall_new, 1)
          old_selftest = "injects a trust-persistence failure and verifies transactional recovery, rolls back to the first version"
          new_selftest = "injects a trust-persistence failure and verifies transactional recovery, rejects overlapping install/rollback/uninstall without package-state mutation, rolls back to the first version"
          if old_selftest not in readme_text:
            raise SystemExit("customer package README selftest anchor drifted")
          readme_text = readme_text.replace(old_selftest, new_selftest, 1)
          readme.write_text(readme_text, encoding="utf-8")

          contract_path = Path("customer-package/contract.json")
          contract = json.loads(contract_path.read_text(encoding="utf-8"))
          managed = contract["managed_install"]
          managed["lifecycle_mutations_serialized"] = True
          managed["lifecycle_lock_scope"] = "existing managed-root parent directory"
          managed["concurrent_secure_mutation"] = "fail_closed_before_package_state_change"
          managed["secure_mutation_requires_existing_parent_directory"] = True
          managed["secure_uninstall_verifies_all_installed_releases"] = True
          managed["unexpected_managed_root_content_blocks_uninstall"] = True
          proofs = contract["truth_boundary"]["source_selftest_can_prove"]
          for proof in (
            "overlapping secure install/rollback/uninstall rejection without package-state mutation",
            "secure uninstall rejection when unexpected managed-root content would otherwise be recursively deleted",
          ):
            if proof not in proofs:
              proofs.append(proof)
          contract_path.write_text(
            json.dumps(contract, ensure_ascii=False, indent=2) + "\n",
            encoding="utf-8",
          )
          PY

      - name: Run focused package verification
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/customer-package-secure.py
          python3 scripts/customer-package.py selftest
          python3 scripts/customer-package-secure.py selftest
          python3 -m json.tool customer-package/contract.json >/dev/null
          git diff --check

      - name: Commit verified repair and remove temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/customer-package-lifecycle-lock-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/customer-package-secure.py customer-package/README.md customer-package/contract.json .github/workflows/customer-package-lifecycle-lock-repair.yml
          git diff --cached --check
          git commit -m "fix(package): serialize and bound secure lifecycle mutations"
          git push origin HEAD:feat/customer-package-current-20260906
