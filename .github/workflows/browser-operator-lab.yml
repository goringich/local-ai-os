name: Browser Operator Lab

on:
  pull_request:
    paths:
      - 'labs/browser-operator/**'
      - '.github/workflows/browser-operator-lab.yml'
  push:
    branches:
      - 'feat/browser-operator-mvp-*'
    paths:
      - 'labs/browser-operator/**'
      - '.github/workflows/browser-operator-lab.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/browser-operator
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies without browser binaries
        run: npm install --ignore-scripts --package-lock=false
      - name: Run syntax and policy checks
        run: npm run check
