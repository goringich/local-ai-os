name: security-lock-refresh

on:
  push:
    branches:
      - security/hardening-2026-09-05

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/hardening-2026-09-05
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm audit --audit-level=high
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "security: refresh lockfile after browserslist override"
          git push origin HEAD:security/hardening-2026-09-05
